services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: college_complaint_management
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  web:
    build: .
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword123
      DB_NAME: college_complaint_management
      DB_PORT: 3306
      JWT_SECRET: college_complaint_jwt_super_secure_key_2026
      JWT_EXPIRES_IN: 1d
      COOKIE_SECRET: college_complaint_cookie_secret_2026
    depends_on:
      - db

volumes:
  db_data:
